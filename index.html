<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a0a;--card:#121212;--card2:#1a1a1a;--border:rgba(255,255,255,0.12);--border2:rgba(255,255,255,0.22);
  --text:#f0f0f0;--muted:#b0b0b0;--muted2:#888888;
  --push:#e0a526;--pull:#dd0060;--legs:#7733cc;--arms:#00bcd4;--done:#22aa66;--skip:#666;
  --accent:#cc5500;--yona:#7733cc;
}
html{height:100%;}
body{
  background:#0a0a0a;color:var(--text);
  font-family:'DM Sans',sans-serif;font-size:14px;
  height:100%;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden;}
.screen.active{display:flex;}

/* ── PROFILE SCREEN ── */
#s-profiles{align-items:center;justify-content:center;padding:24px;gap:0;overflow-y:auto;background:#0a0a0a;}
.gem-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.gem-title{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:.15em;
  background:linear-gradient(135deg,#ff8c42,#c0006e,#7209b7);-webkit-background-clip:text;
  -webkit-text-fill-color:transparent;background-clip:text;}
.gem-sub{font-size:11px;color:#a0a0a0;letter-spacing:.15em;text-transform:uppercase;font-weight:600;}
.prof-cards{display:flex;gap:12px;width:100%;max-width:340px;}
.pcard{flex:1;padding:20px 14px;border-radius:16px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;text-align:center;transition:all .2s;}
.pcard:hover{transform:translateY(-4px);border-color:var(--pc,var(--accent));}
.pav{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:'Bebas Neue',sans-serif;font-size:1.7rem;margin:0 auto 10px;}
.pname{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:.08em;margin-bottom:6px;}
.pmeta{font-size:11px;color:var(--muted2);line-height:1.8;}
.imc-chip{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600;}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(10,10,10,0.97);border-bottom:1px solid rgba(255,255,255,0.12);
  flex-shrink:0;z-index:10;
}
.tlogo{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:15px;border:1.5px solid;flex-shrink:0;}
.tname{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.08em;flex:1;}
.tright{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}

/* ── MAIN CONTENT AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;}
.tab{
  position:absolute;inset:0;
  overflow-y:auto;
  display:none;
  -webkit-overflow-scrolling:touch;
}
.tab.active{display:block;}
.tab::-webkit-scrollbar{width:4px;}
.tab::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
.inner{padding:14px 14px 85px;max-width:900px;margin:0 auto;}

/* ── BOTTOM NAV ── */
.bnav{
  flex-shrink:0;
  background:rgba(10,10,10,0.97);border-top:1px solid rgba(255,255,255,0.12);
  display:none;height:64px;z-index:10;
}
.bnav.on{display:flex;}
.nbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;cursor:pointer;color:var(--muted);
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;padding:0;}
.nbtn.active{color:var(--accent);}
.nbtn-icon{font-size:18px;line-height:1;transition:transform .2s;}
.nbtn.active .nbtn-icon{transform:translateY(-2px);}

/* ── SHARED ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;}
.card-body{padding:16px;}
.section-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:10px;font-weight:600;}
.h1{font-family:'Bebas Neue',sans-serif;letter-spacing:.02em;line-height:.9;}
.mono{font-family:'DM Mono',monospace;}
.bebas{font-family:'Bebas Neue',sans-serif;}

/* ── PLAN TAB ── */
.week-pills{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:16px;}
.wpill{padding:6px 2px;border-radius:8px;text-align:center;border:1px solid var(--border);}
.wpill-day{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:600;}
.wpill-type{font-family:'Bebas Neue',sans-serif;font-size:11px;}
.day-block{margin-bottom:16px;}
.day-hdr{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px 12px 0 0;border:1px solid;border-bottom:none;}
.day-badge{font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:3px 8px;border-radius:4px;font-weight:700;}
.day-title{font-family:'Bebas Neue',sans-serif;font-size:1.25rem;letter-spacing:.04em;flex:1;}
.day-dur{font-size:11px;color:var(--muted);font-weight:500;}
.ex-table{border:1px solid var(--border);border-radius:0 0 12px 12px;overflow:hidden;}
.ex-section{padding:6px 14px;background:rgba(255,255,255,.03);font-size:10px;
  color:var(--muted);text-transform:uppercase;letter-spacing:.12em;border-bottom:1px solid var(--border);font-weight:700;}
.ex-row{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:start;
  padding:12px 14px;border-bottom:1px solid var(--border);}
.ex-row:last-child{border-bottom:none;}
.ex-row.cardio-row{background:rgba(200,241,53,.04);}
.ex-row.star-row{border-left:3px solid gold;background:rgba(255,215,0,0.03);}
.ex-row.rec-row{border-left:3px solid #00bcd4;background:rgba(0,188,212,0.05);}
.ex-num{font-size:11px;color:var(--muted);padding-top:2px;font-weight:600;}
.ex-name{font-size:14px;font-weight:700;line-height:1.3;color:#ffffff;}
.ex-note{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;}
.ex-why{font-size:11px;color:#ff8c33;margin-top:3px;font-style:italic;}
.ex-sets{font-family:'DM Mono',monospace;font-size:11px;white-space:nowrap;padding-top:2px;color:var(--accent);font-weight:600;}

/* Tabla de Series Piramidales / Cargas */
.series-table{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.series-row{display:grid;grid-template-columns:35px 1fr 1fr;gap:8px;align-items:center;}
.series-lbl{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--muted);}
.inp-serie{
  background:var(--card2);border:1px solid var(--border2);border-radius:8px;
  color:#ffffff;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;
  padding:8px;outline:none;width:100%;text-align:center;
}
.inp-serie:focus{border-color:var(--accent);}

/* ── TRACKER TAB ── */
.month-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;}
.month-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;font-size:15px;}
.month-label{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;letter-spacing:.04em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cal-wd{text-align:center;font-size:9px;color:var(--muted);padding:3px 0;
  text-transform:uppercase;letter-spacing:.05em;}
.cal-cell{aspect-ratio:1;border-radius:6px;border:1px solid var(--border);
  background:var(--card);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:all .12s;}
.cal-cell:hover{background:var(--card2);}
.cal-cell.empty{background:transparent;border-color:transparent;cursor:default;}
.cal-cell.today{border-color:var(--accent);}
.cal-cell.selected{background:rgba(200,241,53,.1);border-color:var(--accent);}
.cal-cell.skipped{opacity:.5;}
.cal-num{font-size:11px;font-weight:500;line-height:1;}
.cal-dot{width:5px;height:5px;border-radius:50%;}
.cal-chk{font-size:9px;color:var(--done);}
.day-panel{margin:0 14px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);}
.sess-selector{padding:11px 13px;border-bottom:1px solid var(--border);}
.sess-btns{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.sess-btn{padding:4px 10px;border-radius:6px;border:1px solid var(--border2);
  background:var(--card2);color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;}
.prog-wrap{padding:8px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.prog-bg{flex:1;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;transition:width .3s;}
.prog-txt{font-size:10px;color:var(--muted);white-space:nowrap;}
.prog-pct{font-family:'Bebas Neue',sans-serif;font-size:13px;min-width:34px;text-align:right;}
.notes-wrap{padding:11px 13px;border-top:1px solid var(--border);}
.notes-ta{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;
  padding:8px 10px;resize:none;min-height:64px;line-height:1.5;margin-top:6px;}
.notes-ta:focus{outline:none;border-color:#00994d;}
.note-save{margin-top:6px;padding:5px 12px;border:none;border-radius:6px;
  font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 14px 0;}
.stat-card{padding:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;text-align:center;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.35rem;line-height:1;}
.stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.done-banner{margin:0 14px 10px;padding:9px 12px;border-radius:9px;
  background:rgba(204,85,0,.07);border:1px solid rgba(204,85,0,.2);
  font-size:12px;color:#00994d;display:none;align-items:center;gap:8px;}
.done-banner.on{display:flex;}

/* ── PERFIL TAB ── */
.imc-inputs{display:flex;gap:8px;margin-bottom:12px;}
.imc-inp{flex:1;background:var(--card2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-size:13px;padding:7px 10px;}
.imc-inp:focus{outline:none;border-color:var(--accent);}
.imc-result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  padding:10px;background:var(--card2);border-radius:8px;border:1px solid var(--border);margin-bottom:10px;}
.imc-m{text-align:center;}
.imc-v{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;line-height:1;}
.imc-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;}
.imc-track{height:8px;border-radius:99px;
  background:linear-gradient(to right,#3b82f6 0%,#4ade80 20%,#c8f135 27%,#ff6b35 33%,#ef4444 45%);
  position:relative;margin:6px 0;}
.imc-marker{position:absolute;top:-3px;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid #0a0a0a;transform:translateX(-50%);transition:left .4s;
  box-shadow:0 0 6px rgba(255,255,255,.3);}
.imc-cat{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:.05em;margin-top:6px;}
.macro-sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.macro-sel{background:var(--card2);border:1px solid var(--border2);border-radius:8px;
  color:var(--text);font-size:12px;padding:6px 8px;}
.macro-sel:focus{outline:none;border-color:var(--accent);}
.macro-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.macro-card{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--card2);text-align:center;}
.macro-v{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;line-height:1;}
.macro-l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:2px;}
.macro-s{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── SUPLEMENTOS TAB ── */
.sup-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.sup-tab{padding:5px 12px;border-radius:7px;border:1px solid var(--border2);
  background:var(--card2);color:var(--muted);font-size:11px;cursor:pointer;transition:all .15s;}
.sup-tab.active{background:rgba(204,85,0,.1);border-color:#cc5500;color:#cc5500;}
.sup-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;}
.sup-accent{position:absolute;top:0;left:0;width:3px;height:100%;}
.sup-inner{padding-left:10px;}
.sup-name{font-size:13px;font-weight:500;margin-bottom:2px;}
.sup-dose{font-size:11px;color:var(--muted);margin-bottom:7px;}
.sup-verdict{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:600;display:inline-block;margin-bottom:8px;}
.sup-why{font-size:11px;color:var(--muted);line-height:1.6;background:var(--card2);
  border-radius:7px;padding:8px 10px;border-left:2px solid;}
.sup-tag{font-size:10px;padding:2px 7px;border-radius:5px;margin-right:4px;margin-bottom:5px;display:inline-block;}
</style>
</head>

<script>
'use strict';

// ── PARSER IMPECABLE PARA DECIMALES (Coma ',' o Punto '.') ──
function parseDecimal(val) {
  if (val === null || val === undefined || val === '') return null;
  if (typeof val === 'number') return isNaN(val) ? null : val;
  var str = String(val).trim().replace(',', '.');
  var cleaned = str.replace(/[^0-9.]/g, '');
  var parts = cleaned.split('.');
  if (parts.length > 2) cleaned = parts[0] + '.' + parts.slice(1).join('');
  var num = parseFloat(cleaned);
  return isNaN(num) ? null : num;
}

function formatDecimal(num) {
  if (num === null || num === undefined || isNaN(num)) return '';
  return Number(num.toFixed(2)).toString();
}

const PROFS = {
  deivis: { name:'DEIVIS', age:33, h:1.68, w:88, color:'#cc5500', init:'D' },
  yona:   { name:'YONA',   age:29, h:1.68, w:88, color:'#7733cc', init:'Y' }
};

// ═══════════════════════════════════════════════════════════════
// RUTINA FASE 2 PRO (RESTRICCIÓN EXACTA + RECOMENDADOS)
// ═══════════════════════════════════════════════════════════════
const FASE2_ROUTINE = {
  hombroBrazo: {
    id:'hombroBrazo', title:'FASE 2 PRO — Hombro · Bíceps · Tríceps', emoji:'💪',
    ex: [
      {id:'f2_1', n:'Press Militar', repsTarget:[20,15,12,10]},
      {id:'f2_2', n:'Elevaciones Laterales en Máquina', repsTarget:[20,15,12,10]},
      {id:'f2_3', n:'Posterior en Máquina', repsTarget:[20,20,20,20]},
      {id:'f2_4', n:'Encogimiento de Hombros en Polea', repsTarget:[15,15,15]},
      {id:'f2_5', n:'Curl con Barra Z', repsTarget:[20,15,12,10]},
      {id:'f2_6', n:'Curl de Bíceps Martillo en Polea con Cuerda', repsTarget:[15,15,15]},
      {id:'f2_7', n:'Press Francés con Barra Z', repsTarget:[15,15,15]},
      {id:'f2_8', n:'Tirones tras Nuca con Cuerda', repsTarget:[20,15,12,10]},
      {id:'f2_9', n:'🌟 Curl Inclinado a 45° con Mancuernas', repsTarget:[12,10,8], rec:true},
      {id:'f2_10', n:'🌟 Elevaciones Laterales Inclinadas en Polea', repsTarget:[15,12,10], rec:true}
    ]
  }
};

let CP = null;
const TRACKER_DATA = {};

function selectProfile(id){
  CP = id;
  const p = PROFS[id];
  document.getElementById('s-profiles').classList.remove('active');
  document.getElementById('s-main').classList.add('active');
  document.getElementById('bnav').classList.add('on');
  document.getElementById('tName').textContent = p.name;
  document.getElementById('tName').style.color = p.color;
  goTab('plan');
}

function goTab(t){
  ['plan','tracker','dieta','calorias','suplementos','perfil'].forEach(tab=>{
    const el = document.getElementById('tab-'+tab);
    const nb = document.getElementById('nb-'+tab);
    if(el) el.classList.toggle('active', tab===t);
    if(nb) nb.classList.toggle('active', tab===t);
  });
  if(t==='plan') renderPlan();
  if(t==='tracker') renderTracker();
  if(t==='dieta') renderDieta();
  if(t==='calorias') renderCalorias();
  if(t==='suplementos') renderSups('stack');
  if(t==='perfil') renderPerfil();
}

function renderPlan(){
  const p = PROFS[CP];
  let h = `<div class="inner">
  <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">RUTINA <span style="color:${p.color}">FASE 2 PRO</span></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Estructura Piramidal + Estiramiento activo (2 veces por semana).</div>`;

  const sess = FASE2_ROUTINE.hombroBrazo;
  h += `<div class="day-block">
    <div class="day-hdr" style="border-color:${p.color}40;background:${p.color}10;">
      <span class="day-title">${sess.emoji} ${sess.title}</span>
    </div>
    <div class="ex-table">`;

  sess.ex.forEach((ex)=>{
    h += `<div class="ex-row ${ex.rec?'rec-row':''}">
      <div class="ex-name">${ex.n}</div>
      <div class="ex-sets-target">Objetivo: ${ex.repsTarget.length} Series (${ex.repsTarget.join(' ➔ ')} reps)</div>
    </div>`;
  });

  h += `</div></div></div>`;
  document.getElementById('tab-plan').innerHTML = h;
}

function renderTracker(){
  const p = PROFS[CP];
  let h = `<div class="inner">
  <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">REGISTRO <span style="color:${p.color}">SERIE A SERIE</span></div>
  <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Guarda decimales con coma (24,5) o punto (24.5).</div>`;

  const sess = FASE2_ROUTINE.hombroBrazo;
  sess.ex.forEach((ex)=>{
    h += `<div class="card"><div class="card-body">
      <div class="ex-name" style="color:${ex.rec?'#00bcd4':p.color}">${ex.n}</div>
      <div class="series-table">`;

    ex.repsTarget.forEach((targetReps, sIdx)=>{
      const keyKg = `${CP}_${ex.id}_s${sIdx}_kg`;
      const keyReps = `${CP}_${ex.id}_s${sIdx}_reps`;
      const valKg = TRACKER_DATA[keyKg] !== undefined ? TRACKER_DATA[keyKg] : '';
      const valReps = TRACKER_DATA[keyReps] !== undefined ? TRACKER_DATA[keyReps] : targetReps;

      h += `<div class="series-row">
        <span class="series-lbl">S${sIdx+1}</span>
        <input type="text" class="inp-serie" placeholder="${targetReps} reps" value="${valReps}" onchange="saveSerieVal('${keyReps}', this.value)">
        <input type="text" class="inp-serie" placeholder="0.0 kg" value="${valKg}" onchange="saveSerieKg('${keyKg}', this.value)">
      </div>`;
    });

    h += `</div></div></div>`;
  });

  h += `</div>`;
  document.getElementById('tab-tracker').innerHTML = h;
}

function saveSerieKg(key, rawVal){
  const parsed = parseDecimal(rawVal);
  if(parsed !== null){
    TRACKER_DATA[key] = formatDecimal(parsed);
  } else {
    TRACKER_DATA[key] = '';
  }
}

function saveSerieVal(key, rawVal){
  TRACKER_DATA[key] = rawVal.trim();
}

function renderDieta(){
  const p = PROFS[CP];
  let h = `<div class="inner">
    <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">PLAN <span style="color:${p.color}">NUTRICIONAL</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Estrategia Team David Mármol · 1980 kcal · P:160g · C:196g · G:62g</div>
    <div class="card"><div class="card-body">
      <div class="section-label">Ajuste de Recomposición</div>
      <p style="font-size:12px;color:var(--muted);line-height:1.6;">Déficit ligero de 200 kcal para perder grasa corporal progresiva preservando máxima masa muscular.</p>
    </div></div>
  </div>`;
  document.getElementById('tab-dieta').innerHTML = h;
}

function renderCalorias(){
  const p = PROFS[CP];
  let h = `<div class="inner">
    <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">REGISTRO <span style="color:${p.color}">CALÓRICO</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Contador diario de ingesta y agua.</div>
  </div>`;
  document.getElementById('tab-calorias').innerHTML = h;
}

function renderSups(view){
  const p = PROFS[CP];
  let h = `<div class="inner">
    <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">STACK <span style="color:${p.color}">SUPLEMENTOS</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">Creatina Monohidrato, Whey Isolada, Cafeína, Citrulina Malato, Omega-3, Magnesio.</div>
  </div>`;
  document.getElementById('tab-suplementos').innerHTML = h;
}

function renderPerfil(){
  const p = PROFS[CP];
  let h = `<div class="inner">
    <div class="h1" style="font-size:2.5rem;margin-bottom:6px;">PERFIL DE <span style="color:${p.color}">${p.name}</span></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:16px;">33 años · 88kg · Recomposición Activa</div>
  </div>`;
  document.getElementById('tab-perfil').innerHTML = h;
}

function goProfiles(){
  document.getElementById('s-main').classList.remove('active');
  document.getElementById('s-profiles').classList.add('active');
}
</script>
</body>
</html>
